version: 2

# Dependabot version updates for every lockfile/manifest in the repository.
# Security updates are opened independently of this file (see
# docs/security/vulnerability-management.md); this configuration makes sure
# routine minor/patch bumps also arrive as PRs instead of going stale silently.
#
# Version-update PRs target `dev`, the integration branch; `dev` is merged into
# `main` (the default branch, which is where Dependabot reads this file) for
# releases. `dev` must stay in sync with `main` because Dependabot scans the
# manifests on the target branch. Security-update PRs are NOT affected by
# `target-branch` and always target `main`.
updates:
  # Root workspace (build/dev tooling for both apps)
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-all:
        patterns: ['*']
  # Backend API
  - package-ecosystem: npm
    directory: "/backend"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-all:
        patterns: ['*']
    # Majors that need a migration before they can be bumped; without this they
    # are folded into the weekly group and the PR fails to install.
    ignore:
      # eslint 10 removed .eslintrc support; needs a flat-config migration.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # @typescript-eslint 8.x peers require typescript <6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # ESM-only; the backend compiles to CommonJS.
      - dependency-name: p-limit
        update-types: ['version-update:semver-major']
      - dependency-name: http-proxy-agent
        update-types: ['version-update:semver-major']
      - dependency-name: https-proxy-agent
        update-types: ['version-update:semver-major']

  # Frontend web UI
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-all:
        patterns: ['*']
    # Same migrations as /backend: .eslintrc.js and the typescript-eslint peer
    # range block the eslint 10 and typescript 7 majors.
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Container base images (RGW base, UBI builder/tooling stages)
  - package-ecosystem: docker
    directory: "/docker"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # GitHub Actions used by CI
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ['*']
